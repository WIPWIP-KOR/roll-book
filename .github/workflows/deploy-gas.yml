name: Deploy Apps Script (GAS)

# google-apps-script/ 아래 코드가 main에 머지되면 clasp로 자동 푸시 + 재배포한다.
# (프론트엔드는 GitHub Pages가 자동 배포하므로 별도 처리 불필요)
on:
  push:
    branches: [main]
    paths:
      - 'google-apps-script/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

# 배포가 동시에 겹치지 않도록 직렬화
concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 로컬에서 clasp login 할 때와 동일한 버전으로 고정 (인증 파일 호환성)
      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      # GitHub Secret(CLASPRC_JSON)에 저장해 둔 인증 정보를 복원
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      # google-apps-script/ 의 Code.gs, appsscript.json 을 Apps Script 프로젝트로 푸시
      - name: Push code to Apps Script
        run: clasp push -f

      # 프론트엔드가 쓰는 배포 URL을 그대로 유지하려면 "기존 배포 ID"를 재배포해야 한다.
      # (배포 ID는 이미 프론트엔드 JS에 공개돼 있으므로 비밀이 아님 → 워크플로에 직접 기입)
      # ⚠️ 아래 ID가 현재 스크립트 프로젝트의 배포가 맞는지 `clasp deployments`로 확인하세요.
      #     맞지 않는 ID가 있으면 해당 step을 수정/삭제하면 됩니다.
      - name: Redeploy (admin / stats URL)
        run: >-
          clasp deploy
          -i AKfycbxjmvZWEErrnhyGtgyhrpBAoy8lF_Cw7V9bJNgTBCRQKeFrkROu-tp43uAcSEu9VxBd
          -d "CI ${{ github.sha }}"

      - name: Redeploy (attendance URL)
        run: >-
          clasp deploy
          -i AKfycbwhl5jaYxeROUK4w8-unbtmeYENfmA7p56DwYC4xO9gunbnoJXPmKdfUnLvd-_k8GHd
          -d "CI ${{ github.sha }}"
